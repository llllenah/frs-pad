name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for OpenCV and MediaPipe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -o addopts="" -q -p no:warnings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t frs-pad:ci .
      - name: Smoke test
        run: |
          docker run -d --name frs -p 8000:8000 \
            -e PAD_ADMIN_EMAIL=ci@example.com -e PAD_ADMIN_PASSWORD=ci-password-123 \
            -e PAD_JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef frs-pad:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/config)" = 401
          curl -sf -X POST http://localhost:8000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' | grep -q '"role":"admin"'
          docker logs frs | tail -20
