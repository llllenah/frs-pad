# Параметри модуля виявлення атак (PadSettings) і шляхи до моделей.
# Шляхи задано відносно кореня проєкту frs-pad.

pad:
  challenge_types: [cover_left, cover_right, cover_mouth, turn_head, hand_swipe]
  challenge_count: 3        # 2–5
  duration_s: 5.0           # 3–5 с
  threshold: 0.5            # поріг рішення τ у [0; 1]; після навчання – recommended_threshold
  max_retries: 2
  reference_s: 1.0
  before_s: 1.0
  after_s: 1.5
  hold_s: 0.5
  session_timeout_s: 20.0
  min_det_score: 0.9
  min_coverage: 0.4
  min_yaw_deg: 30.0
  min_shift: 0.5
  consecutive_frames: 5
  recovery_ratio: 0.9

models:
  # MTCNN (каталог з mtcnn_pnet/rnet/onet.onnx) і MobileFaceNet INT8 – scripts/download_models.py.
  # Запасний варіант: detector: models/face_detection_yunet_2023mar.onnx,
  # embedder: models/face_recognition_sface_2021dec.onnx, embedder_profile: sface.
  detector: models
  detector_min_face: 40     # мінімальний розмір обличчя, пікселів (після масштабування)
  detector_max_side: 640    # попереднє масштабування кадру за довшою стороною
  embedder: models/mobilefacenet_int8.onnx
  embedder_threads: 4
  embedder_profile: mobilefacenet

# Модель класифікатора (.json або .onnx), яку створює scripts/train.py --install.
# Якщо файлу немає, використовується базовий поріг на мінімумі s_ref.
classifier: models/pad_logistic.json

camera:
  width: 1280
  height: 720
