[project]
name = "frs-pad"
version = "0.2.0"
description = "Розпізнавання обличчя у відеопотоці з виявленням атак підміни обличчя на основі активних викликів"
requires-python = ">=3.10,<3.13"

[tool.setuptools]
packages = ["pad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# starlette.testclient радить httpx2 замість httpx; на роботу тестів це не впливає
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]
